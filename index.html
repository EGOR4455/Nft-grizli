<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NFT Casino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #1a1a2e, #05050a);
  color: white; min-height: 100vh;
  display: flex; justify-content: center; align-items: center; padding: 16px;
}
.app { width: 100%; max-width: 520px; background: #10101f; border-radius: 24px; padding: 24px; }
.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.logo { font-size: 18px; color: #ff6b00; font-weight: bold; }
.balance { background: #1e1e35; padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: bold; }
.case-title { text-align: center; color: #ffb347; font-size: 16px; margin-bottom: 12px; }
.viewport { position: relative; height: 110px; overflow: hidden; background: #080812; border-radius: 14px; border: 2px solid #2a2a45; margin-bottom: 20px; }
.line { display: flex; height: 100%; align-items: center; }
.item { min-width: 100px; height: 90px; margin: 0 5px; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 13px; font-weight: bold; flex-shrink: 0; }
.item.common { background: #23233d; color: #9a9ab0; }
.item.rare { background: #3a2a6a; color: #b28aff; }
.item.epic { background: #6a2a5a; color: #ff8ad8; }
.item.nft { background: linear-gradient(135deg, #ff6b00, #ff2d55); color: white; box-shadow: 0 0 20px rgba(255,107,0,0.8); }
.pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background: #ff2d55; transform: translateX(-50%); box-shadow: 0 0 12px #ff2d55; z-index: 5; }
.btn { width: 100%; padding: 16px; font-size: 16px; font-weight: bold; background: linear-gradient(135deg, #ff6b00, #ff2d55); color: white; border: none; border-radius: 14px; cursor: pointer; }
.btn:disabled { opacity: 0.5; }
.result { text-align: center; margin-top: 16px; min-height: 24px; font-size: 15px; font-weight: bold; }
.inv { margin-top: 20px; padding-top: 20px; border-top: 1px solid #23233d; }
.inv-title { font-size: 13px; color: #7a7a95; margin-bottom: 10px; }
.inv-list { display: flex; flex-wrap: wrap; gap: 8px; min-height: 30px; }
.inv-item { background: #23233d; padding: 6px 12px; border-radius: 8px; font-size: 12px; }
.inv-item.nft { background: linear-gradient(135deg, #ff6b00, #ff2d55); }
.empty { color: #4a4a65; font-size: 12px; }
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="logo">🎰 NFT CASINO</div>
    <div class="balance">⭐ <span id="balance">1000</span></div>
  </div>
  <div class="case-title">BRONZE CASE — 150 ⭐</div>
  <div class="viewport">
    <div class="line" id="line"></div>
    <div class="pointer"></div>
  </div>
  <button class="btn" id="openBtn">Открыть кейс</button>
  <div class="result" id="result"></div>
  <div class="inv">
    <div class="inv-title">ИНВЕНТАРЬ</div>
    <div class="inv-list" id="invList"><span class="empty">Пусто</span></div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor("#10101f");
  tg.setBackgroundColor("#05050a");
}
const CASE_PRICE = 150;
const ITEMS = [
  { label: "10 ⭐", type: "stars", amount: 10, cls: "common", chance: 30 },
  { label: "50 ⭐", type: "stars", amount: 50, cls: "common", chance: 25 },
  { label: "100 ⭐", type: "stars", amount: 100, cls: "rare", chance: 20 },
  { label: "150 ⭐", type: "stars", amount: 150, cls: "rare", chance: 13 },
  { label: "250 ⭐", type: "stars", amount: 250, cls: "epic", chance: 8 },
  { label: "NFT 🐵", type: "nft", amount: 0, cls: "nft", chance: 4 },
];
let balance = 1000;
let inventory = [];
let spinning = false;
const balanceEl = document.getElementById("balance");
const lineEl = document.getElementById("line");
const btnEl = document.getElementById("openBtn");
const resultEl = document.getElementById("result");
const invListEl = document.getElementById("invList");
function pickWinner() {
  const total = ITEMS.reduce((s, i) => s + i.chance, 0);
  let r = Math.random() * total;
  for (const item of ITEMS) {
    if (r < item.chance) return item;
    r -= item.chance;
  }
  return ITEMS[0];
}
function makeItemEl(item) {
  const d = document.createElement("div");
  d.className = "item " + item.cls;
  d.textContent = item.label;
  return d;
}
function updateBalance() { balanceEl.textContent = balance; }
function renderInventory() {
  if (inventory.length === 0) { invListEl.innerHTML = '<span class="empty">Пусто</span>'; return; }
  invListEl.innerHTML = "";
  inventory.forEach(it => {
    const d = document.createElement("div");
    d.className = "inv-item" + (it.type === "nft" ? " nft" : "");
    d.textContent = it.label;
    invListEl.appendChild(d);
  });
}
async function openCase() {
  if (spinning) return;
  if (balance < CASE_PRICE) {
    resultEl.textContent = "❌ Не хватает звёзд!";
    resultEl.style.color = "#ff2d55";
    if (tg) tg.HapticFeedback?.notificationOccurred("error");
    return;
  }
  spinning = true; btnEl.disabled = true; resultEl.textContent = ""; resultEl.style.color = "";
  balance -= CASE_PRICE; updateBalance();
  if (tg) tg.HapticFeedback?.impactOccurred("medium");
  const winner = pickWinner();
  const line = [];
  for (let i = 0; i < 40; i++) line.push(ITEMS[Math.floor(Math.random() * ITEMS.length)]);
  const winnerIndex = 40;
  line.push(winner);
  for (let i = 0; i < 5; i++) line.push(ITEMS[Math.floor(Math.random() * ITEMS.length)]);
  lineEl.style.transition = "none";
  lineEl.style.transform = "translateX(0)";
  lineEl.innerHTML = "";
  line.forEach(it => lineEl.appendChild(makeItemEl(it)));
  await new Promise(r => requestAnimationFrame(r));
  const itemW = 110;
  const viewportW = lineEl.parentElement.offsetWidth;
  const offset = (viewportW / 2) - (itemW * winnerIndex) - (itemW / 2);
  lineEl.style.transition = "transform 4.5s cubic-bezier(0.15, 0.85, 0.25, 1)";
  lineEl.style.transform = "translateX(" + offset + "px)";
  await new Promise(r => setTimeout(r, 4700));
  if (winner.type === "stars") {
    balance += winner.amount; updateBalance();
    resultEl.textContent = "✅ +" + winner.amount + " ⭐";
    resultEl.style.color = winner.amount >= 250 ? "#ff8ad8" : "#ffb347";
    if (tg) tg.HapticFeedback?.notificationOccurred(winner.amount >= 250 ? "success" : "warning");
  } else {
    inventory.push(winner); renderInventory();
    resultEl.textContent = "🐵 ПОЙМАЛ NFT!";
    resultEl.style.color = "#ff6b00";
    if (tg) tg.HapticFeedback?.notificationOccurred("success");
  }
  spinning = false; btnEl.disabled = false;
}
btnEl.addEventListener("click", openCase);
updateBalance();
renderInventory();
</script>

</body>
</html>
